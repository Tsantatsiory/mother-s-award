<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonne Fête Maman ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card" id="motherCard">
    <div class="title-wrap">
        <i class="fas fa-heart heart-icon"></i>
        <h1 id="mainTitle">Bonne fête Maman! 🌸</h1>
        <i class="fas fa-heart heart-icon"></i>
    </div>

    <div class="img-container">
        <img id="motherGif" src="https://media.tenor.com/5h7W0c7q0n0AAAAi/cat-cute.gif" alt="fleurs maman">
    </div>

    <div class="sub-message" id="subMsg">
        <i class="fas fa-heartbeat"></i> Pour la plus merveilleuse des mamans
    </div>

    <div class="button-group" id="buttonGroup">
        <button class="btn btn-yes" id="yesBtn">Oui, je t'aime ❤️</button>
        <button class="btn btn-no" id="noBtn">Non... 😢</button>
    </div>
    <div class="gift-icon" id="giftIcon">
        <i class="fas fa-gift"></i> <i class="fas fa-feather-alt"></i>
    </div>
</div>

</body>
</html>
